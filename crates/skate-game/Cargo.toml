[package]
name = "skate-game"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "skate3rust"
path = "src/main.rs"

[[bin]]
name = "skate3-audio-check"
path = "src/audio_check_main.rs"
test = false

[[bin]]
name = "skate3-multiplayer"
path = "src/multiplayer_main.rs"
test = false

[[bin]]
name = "skate3-custom-models"
path = "src/custom_models_main.rs"
test = false

[features]
default = ["dev-dynamic", "story-mode"]
dev-dynamic = ["bevy/dynamic_linking"]
# The Skate 3 story mode (skate3_career) and its Skate School. Release builds leave it out unless
# scripts/Build-Release.ps1 -StoryMode: the career never starts and the build starts up as before story mode.
story-mode = []
# NVIDIA DLSS (Settings > Graphics > DLSS), off by default. Needs the DLSS_SDK env var (NVIDIA's SDK, never in this
# repo) at build time and nvngx_dlss.dll beside the exe at run time: docs/dlss.md.
dlss = ["bevy/dlss", "dep:dlss_wgpu"]
# The two-copy voice loopback test's hooks (voice.rs Hooks: SKATE_VOICE_CLIP/DUMP/MUTE_BOT). Off in every real build
# (user 10-27); only that test's exe is built with it.
voice-test = []

[dependencies]
bevy = { workspace = true, features = ["jpeg", "trace", "debug"] }
tracing-log = "0.2"
skate-core.workspace = true
skate-data.workspace = true
skate-audio-formats.workspace = true
skate-audio-core.workspace = true
# Voice chat (user 10-26): devices, the engine thread and its DSP.
skate-voice.workspace = true
half = "=2.7.1"
# Only with the dlss feature: the vendored crate's model choice (vendor/README.md).
dlss_wgpu = { version = "2.0.0", optional = true }
serde_json.workspace = true
serde.workspace = true
skate-mods = { path = "../skate-mods" }
mlua = { version = "=0.12.1", features = ["lua54", "vendored", "send"] }

skate-vehicles = { path = "../skate-vehicles" }
skate-net = { path = "../skate-net" }
# Skate 2 physics switch (user 10-20, Amendment A: one program): the vendored port's host library runs its session on a
# thread inside the game, and the protocol crate holds the messages they swap. The port is its own cargo workspace
# (vendor/skate2-rust-port/VENDORED.md); here it builds with the game's profiles. Not tested in play.
skate2-physics-host = { path = "../../vendor/skate2-rust-port/host" }
skate2-physics-protocol = { path = "../skate2-physics-protocol" }
blake3 = "=1.8.7"
sha2 = "=0.10.9"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
intel_tex_2 = "0.5"
# Graphic Creator designs (already in the lockfile through Bevy).
base64 = "0.22.1"
tiny-skia = { version = "0.11.4", default-features = false, features = ["std", "simd"] }
ttf-parser = "0.25.1"
# Edit Skaters: the Friends' Skaters list's accent-insensitive sort (already in the lockfile through url/idna).
icu_normalizer = { version = "2.3.0", default-features = false, features = ["compiled_data"] }
# Replay Editor recorder blocks and saves (already in the lockfile through skate-data).
zstd = "=0.13.3"
# The adapter's DeviceType (Bevy's own wgpu; first-run graphics defaults).
wgpu = { version = "=27.0.1", default-features = false }
# Controllers XInput doesn't see (input/generic_pads.rs); already in the lockfile through Bevy.
gilrs = "0.11.2"
# Weather audio's Vorbis clips (weather_audio/stream.rs); already in the lockfile through Bevy's rodio.
lewton = "=0.10.2"
# lewton's own page reader (already in Cargo.lock): the weather clips decode packet by packet (weather_audio/stream.rs).
ogg = "=0.8.0"
# The creator tag's Ed25519 proofs (creator.rs); the launcher's version, already in the lockfile through rustls.
ring = "0.17"

[target.'cfg(windows)'.dependencies]
# The window's S3R icon (app.rs window_icon): bevy_winit's own winit, for its Windows icon calls; no feature added.
winit = { version = "=0.30.13", default-features = false }
# PS4 / PS5 / Switch Pro HID driver (input/hid.rs); already in the lockfile.
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_DeviceAndDriverInstallation",
    # Graphic Creator share codes: the clipboard (share_code.rs).
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    # The creator key, sealed with DPAPI (creator.rs).
    "Win32_Security_Cryptography",
] }
# Replay Editor: the Documents / Pictures / Videos known folders, local file-name times and the MP4 export
# (replay/file.rs, replay/mf.rs); already in the lockfile through gilrs-core, only features added. The `=0.62.2` pin
# is gilrs-core's version: bump it together with gilrs, or resolution fails (review M15). Media Foundation is loaded
# at run time (LibraryLoader), never imported, so Windows N without the Media Feature Pack still starts (review C1).
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Time",
    "Win32_UI_Shell",
    "Win32_Media_MediaFoundation",
    # Crash reports: the graphics cards and their VRAM, read after a crash (crash_native.rs hardware).
    "Win32_Graphics_Dxgi",
] }

[dev-dependencies]
naga = { version = "=27.0.3", features = ["wgsl-in"] }
naga_oil = { version = "=0.20.0", default-features = false }
wgpu = { version = "=27.0.1", default-features = false, features = ["vulkan", "naga-ir"] }
