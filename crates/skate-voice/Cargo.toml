[package]
name = "skate-voice"
description = "Online voice chat: the microphone, noise suppression, Opus, the jitter buffer and the mix, off the game thread"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
skate-net = { path = "../skate-net" }
# Opus (DECISIONS.md): libopus 1.3.1 through c2rust encodes (opus-rs's encoder panics with in-band FEC at 24 kbps 20 ms);
# opus-rs decodes (libopus's decoder goes to full scale concealing a lost packet or a DTX gap). Both BSD-3-Clause.
unsafe-libopus = "0.2.0"
opus-rs = "0.1.40"
nnnoiseless = { version = "0.5.2", default-features = false }
# DeepFilterNet (High noise suppression): crates.io stops at 0.2.5 (2022, no tract); pinned to libDF's main.
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", rev = "d375b2d8309e0935d165700c91da9de862a99c31", default-features = false, features = ["tract", "default-model"] }
# Unused here: it pins libDF's tract to its own lockfile's 0.21.4 (0.21.10 dropped Graph::symbol_table, which libDF uses).
tract-core = "=0.21.4"
ndarray = "0.15"
# The microphone: the lockfile's cpal (rodio's).
cpal = "0.15.3"

[dev-dependencies]
hound = "3.5"
